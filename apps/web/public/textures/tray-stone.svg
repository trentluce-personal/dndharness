<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
  <!-- Staggered 128px limestone/slate tiles: quiet joints, softly worn edges. -->
  <defs>
    <linearGradient id="bevel" x2=".75" y2="1">
      <stop stop-color="#d6dcdd" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#a0a8ab" stop-opacity=".08"/>
      <stop offset="1" stop-color="#323c42" stop-opacity=".32"/>
    </linearGradient>
    <pattern id="tiles" width="768" height="256" patternUnits="userSpaceOnUse">
      <g stroke="url(#bevel)" stroke-width="2">
        <rect x="1.5" y="1.5" width="125" height="125" rx="2" fill="#858c8e"/>
        <rect x="129.5" y="1.5" width="125" height="125" rx="2" fill="#80888b"/>
        <rect x="257.5" y="1.5" width="125" height="125" rx="2" fill="#899092"/>
        <rect x="385.5" y="1.5" width="125" height="125" rx="2" fill="#83898b"/>
        <rect x="513.5" y="1.5" width="125" height="125" rx="2" fill="#878e90"/>
        <rect x="641.5" y="1.5" width="125" height="125" rx="2" fill="#7f888c"/>
        <rect x="-62.5" y="129.5" width="125" height="125" rx="2" fill="#848d90"/>
        <rect x="65.5" y="129.5" width="125" height="125" rx="2" fill="#899092"/>
        <rect x="193.5" y="129.5" width="125" height="125" rx="2" fill="#838b8e"/>
        <rect x="321.5" y="129.5" width="125" height="125" rx="2" fill="#878d8e"/>
        <rect x="449.5" y="129.5" width="125" height="125" rx="2" fill="#80898c"/>
        <rect x="577.5" y="129.5" width="125" height="125" rx="2" fill="#878f92"/>
        <rect x="705.5" y="129.5" width="125" height="125" rx="2" fill="#848d90"/>
      </g>
    </pattern>
    <filter id="mineral" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".017 .029" numOctaves="4" seed="47" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope=".6" intercept=".2"/>
        <feFuncG type="linear" slope=".6" intercept=".2"/>
        <feFuncB type="linear" slope=".6" intercept=".2"/>
        <feFuncA type="linear" slope=".3"/>
      </feComponentTransfer>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" seed="83" stitchTiles="stitch"/>
      <feDiffuseLighting surfaceScale=".7" diffuseConstant=".85" lighting-color="#ffffff">
        <feDistantLight azimuth="225" elevation="50"/>
      </feDiffuseLighting>
      <feComponentTransfer><feFuncA type="linear" slope=".1"/></feComponentTransfer>
    </filter>
  </defs>
  <path fill="#727a7e" d="M0 0h768v768H0z"/>
  <path fill="url(#tiles)" d="M0 0h768v768H0z"/>
  <path fill="#808080" filter="url(#mineral)" d="M0 0h768v768H0z"/>
  <path fill="#808080" filter="url(#grain)" d="M0 0h768v768H0z"/>
</svg>
