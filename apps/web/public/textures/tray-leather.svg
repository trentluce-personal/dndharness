<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768">
  <!-- Irregular hide relief, lit from upper left; no radial cells or small tiles. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".32" numOctaves="3" seed="29" result="pores"/>
    <feDiffuseLighting in="pores" surfaceScale=".55" diffuseConstant=".85" lighting-color="#ffffff">
      <feDistantLight azimuth="225" elevation="48"/>
    </feDiffuseLighting>
    <feComponentTransfer><feFuncA type="linear" slope=".16"/></feComponentTransfer>
  </filter>
  <filter id="creases" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="turbulence" baseFrequency=".018 .027" numOctaves="2" seed="11"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope=".7"/>
      <feFuncG type="linear" slope=".7"/>
      <feFuncB type="linear" slope=".7"/>
      <feFuncA type="linear" slope=".12"/>
    </feComponentTransfer>
  </filter>
  <path fill="#808080" filter="url(#creases)" d="M0 0h768v768H0z"/>
  <path fill="#808080" filter="url(#grain)" d="M0 0h768v768H0z"/>
</svg>
