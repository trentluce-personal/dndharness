name: dndharness

services:
  db:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: dndharness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; see .env.example}
      POSTGRES_DB: dndharness
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dndharness -d dndharness"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dndharness:${POSTGRES_PASSWORD}@db:5432/dndharness
      PORT: "3001"
      APP_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/node_modules
      - api_workspace_node_modules:/workspace/apps/api/node_modules
      - api_web_node_modules:/workspace/apps/web/node_modules
    command: ["sh", "-c", "npm ci --workspace=@dndharness/api --include-workspace-root=false && exec npm run dev --workspace=@dndharness/api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    working_dir: /workspace
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_USE_POLLING: "true"
      API_PROXY_TARGET: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_workspace_node_modules:/workspace/apps/web/node_modules
      - web_api_node_modules:/workspace/apps/api/node_modules
    command:
      - sh
      - -c
      - npm ci --workspace=@dndharness/web --include-workspace-root=false && exec npm run dev --workspace=@dndharness/web -- --host 0.0.0.0 --port 5173 --strictPort
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  web_node_modules:
  web_workspace_node_modules:
  web_api_node_modules:
  api_node_modules:
  api_workspace_node_modules:
  api_web_node_modules:
  database:
